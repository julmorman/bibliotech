<script>
  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function formatDate(date) {
    if (!date) return '';
    const d = new Date(date);
    return isNaN(d) ? '' : d.toLocaleDateString('es-AR');
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(btn.dataset.tab).classList.add('active');
      btn.classList.add('active');
    });
  });

  let currentProfile = null;

  function init() {
    google.script.run
      .withSuccessHandler(onProfile)
      .withFailureHandler(onInitError)
      .getCurrentProfile();
  }

  function onInitError(err) {
    document.body.innerHTML = '<p class="msg error">Error inesperado: ' + escapeHtml(err.message) + '</p>';
  }

  function onProfile(profile) {
    if (!profile) {
      document.getElementById('perfil-gate').hidden = false;
      return;
    }
    currentProfile = profile;
    showApp();
  }

  document.getElementById('form-perfil').addEventListener('submit', function (e) {
    e.preventDefault();
    const data = {
      name: document.getElementById('perfil-nombre').value,
      grade: document.getElementById('perfil-curso').value
    };
    const msg = document.getElementById('perfil-msg');
    msg.className = 'msg';
    msg.textContent = '';

    google.script.run
      .withSuccessHandler(function (res) {
        if (res.ok) {
          currentProfile = res.profile;
          document.getElementById('perfil-gate').hidden = true;
          showApp();
        } else {
          msg.textContent = '❌ ' + res.error;
          msg.className = 'msg error';
        }
      })
      .withFailureHandler(function (err) {
        msg.textContent = '❌ Error inesperado: ' + err.message;
        msg.className = 'msg error';
      })
      .createProfile(data);
  });

  function showApp() {
    document.getElementById('app').hidden = false;
    if (currentProfile.role === 'staff') {
      document.getElementById('tab-btn-staff').hidden = false;
      loadStaff();
    }
    loadCatalog();
    loadMyLoans();
  }

  function loadCatalog() {
    google.script.run.withSuccessHandler(renderCatalog).getCatalog();
  }

  function renderCatalog(books) {
    const tbody = document.querySelector('#tabla-libros tbody');
    const select = document.getElementById('libro');

    tbody.innerHTML = books.length
      ? books.map(b => `<tr><td>${escapeHtml(b.title)}</td><td>${escapeHtml(b.author)}</td><td>${b.available}</td></tr>`).join('')
      : '<tr><td colspan="3">No hay libros disponibles.</td></tr>';

    select.innerHTML = '<option value="" disabled selected>Elegí un libro...</option>' +
      books.map(b => `<option value="${escapeHtml(b.title)}">${escapeHtml(b.title)}</option>`).join('');
  }

  document.getElementById('form-prestamo').addEventListener('submit', function (e) {
    e.preventDefault();
    const button = document.getElementById('btn-confirmar');
    const msg = document.getElementById('msg');
    const data = { book: document.getElementById('libro').value };

    button.disabled = true;
    msg.className = 'msg';
    msg.textContent = '';

    google.script.run
      .withSuccessHandler(function (res) {
        button.disabled = false;
        if (res.ok) {
          msg.textContent = '✅ ¡Listo! Tu solicitud fue registrada.';
          msg.className = 'msg ok';
          document.getElementById('form-prestamo').reset();
          loadCatalog();
          loadMyLoans();
        } else {
          msg.textContent = '❌ ' + res.error;
          msg.className = 'msg error';
        }
      })
      .withFailureHandler(function (err) {
        button.disabled = false;
        msg.textContent = '❌ Error inesperado: ' + err.message;
        msg.className = 'msg error';
      })
      .requestLoan(data);
  });

  function loadMyLoans() {
    google.script.run.withSuccessHandler(renderMyLoans).getMyLoans();
  }

  function renderMyLoans(loans) {
    const tbody = document.querySelector('#tabla-mis-prestamos tbody');
    tbody.innerHTML = loans.length
      ? loans.map(l => `<tr><td>${escapeHtml(l.book)}</td><td><span class="badge badge-${escapeHtml((l.status || '').toLowerCase())}">${escapeHtml(l.status)}</span></td><td>${formatDate(l.date)}</td></tr>`).join('')
      : '<tr><td colspan="3">Todavía no pediste ningún préstamo.</td></tr>';
  }

  function loadStaff() {
    google.script.run.withSuccessHandler(renderPendingRequests).getPendingRequests();
    google.script.run.withSuccessHandler(renderActiveLoans).getActiveLoans();
  }

  function renderPendingRequests(requests) {
    const tbody = document.querySelector('#tabla-solicitudes tbody');
    tbody.innerHTML = requests.length
      ? requests.map(l => `<tr><td>${escapeHtml(l.book)}</td><td>${escapeHtml(l.name)}</td><td>${escapeHtml(l.grade)}</td><td><button type="button" onclick="deliver('${l.id}')">Confirmar entrega</button></td></tr>`).join('')
      : '<tr><td colspan="4">No hay solicitudes pendientes.</td></tr>';
  }

  function renderActiveLoans(loans) {
    const tbody = document.querySelector('#tabla-activos tbody');
    tbody.innerHTML = loans.length
      ? loans.map(l => `<tr><td>${escapeHtml(l.book)}</td><td>${escapeHtml(l.name)}</td><td>${escapeHtml(l.grade)}</td><td><button type="button" onclick="returnBook('${l.id}')">Confirmar devolución</button></td></tr>`).join('')
      : '<tr><td colspan="4">No hay préstamos entregados.</td></tr>';
  }

  function deliver(id) {
    google.script.run.withSuccessHandler(loadStaff).confirmDelivery(id);
  }

  function returnBook(id) {
    google.script.run
      .withSuccessHandler(function () {
        loadStaff();
        loadCatalog();
      })
      .confirmReturn(id);
  }

  init();
</script>
